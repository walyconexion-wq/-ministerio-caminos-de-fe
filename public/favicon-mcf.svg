<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="mcfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Circular -->
  <circle cx="50" cy="50" r="48" fill="#070A14" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Resplandor del Espíritu -->
  <circle cx="50" cy="50" r="36" fill="url(#mcfGrad)" opacity="0.35" filter="url(#glow)"/>

  <!-- Rayos de Luz Divina -->
  <path d="M50 8 L50 20 M50 80 L50 92 M8 50 L20 50 M80 50 L92 50" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M20 20 L29 29 M71 71 L80 80 M80 20 L71 29 M29 71 L20 80" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Cruz Central Gloriosa -->
  <rect x="46" y="24" width="8" height="52" rx="4" fill="url(#goldGrad)" filter="url(#glow)"/>
  <rect x="30" y="38" width="40" height="8" rx="4" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Destello Central -->
  <circle cx="50" cy="42" r="4" fill="#FFFFFF"/>
</svg>